[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-it-up"
version = "0.1.0"
description = "Reproducible modeling for DrivenData's Pump It Up competition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2,<5",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

